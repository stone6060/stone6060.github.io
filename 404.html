<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在</title>
<meta name="description" content="">
<style>
:root{--ink:#1a1a1a;--ink2:#3d3d3d;--ink3:#6b6b6b;--ink4:#949494;
--rule:#e2dfd8;--accent:#1a4d3e;--accent-soft:#eef3f0;--bg:#fbfaf7;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
background:var(--bg);color:var(--ink);line-height:1.75;-webkit-font-smoothing:antialiased;font-size:15px}
a{color:inherit;text-decoration:none}
.wrap{max-width:920px;margin:0 auto;padding:0 24px}

.nav{position:sticky;top:0;z-index:20;background:rgba(251,250,247,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--rule)}
.nav-inner{max-width:920px;margin:0 auto;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
.nav-name{font-weight:600;letter-spacing:.02em}
.nav-links{display:flex;gap:22px;font-size:13.5px;color:var(--ink3)}
.nav-links a:hover{color:var(--accent)}

.hero{padding:72px 0 56px}
.hero h1{font-size:40px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.hero .en{font-size:14px;color:var(--ink4);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.hero p.lead{font-size:17px;color:var(--ink2);margin-top:18px;max-width:640px}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:22px;font-size:14px;color:var(--ink3)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:100px;
background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:500}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}

section{padding:44px 0}
section+section{border-top:1px solid var(--rule)}
h2.sec{font-size:13px;font-weight:700;letter-spacing:.16em;color:var(--accent);text-transform:uppercase;margin-bottom:26px}

.cards{display:grid;gap:26px}
.card{display:grid;grid-template-columns:340px 1fr;background:var(--card);border:1px solid var(--rule);
border-radius:12px;overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s;
height:250px}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.08);border-color:#cfcabf}
.card-img{background:#f2f0ec;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.card-ph{width:100%;height:100%;min-height:180px;display:flex;align-items:center;justify-content:center;
         background:linear-gradient(135deg,#f0eee9,#e4e1da)}
.card-ph span{font-size:34px;font-weight:700;color:#c8c4bb;letter-spacing:.06em}
.card-img img{width:100%;height:100%;object-fit:cover;display:block}
.card-img img.contain{object-fit:contain;padding:10px}

.card-body{padding:20px 26px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.card h3{font-size:19px;font-weight:650;line-height:1.35}
.card .sub{font-size:12.5px;color:var(--accent);font-weight:500;margin-top:5px}
.card .tagline{font-size:14px;color:var(--ink2);margin-top:10px;flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;align-items:center;max-height:32px;overflow:hidden}
.card .foot .chip{margin:0}
.chip{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:5px;background:#f4f2ee;color:var(--ink3);margin:0 5px 5px 0}
.chip.hl{background:var(--accent-soft);color:var(--accent);font-weight:500}
.card .more{margin-top:auto;padding-top:8px;font-size:13px;color:var(--accent);font-weight:500}
.card:hover .more{text-decoration:underline}

.awards{list-style:none;display:grid;gap:2px}
.awards li{display:flex;justify-content:space-between;gap:16px;padding:13px 0;
border-bottom:1px solid var(--rule);font-size:14.5px;align-items:baseline}
.awards li:last-child{border-bottom:0}
.awards .l{color:var(--ink2)}
.awards .l b{color:var(--ink);font-weight:600}
.awards .l .sub{display:block;font-size:12.5px;color:var(--ink3);margin-top:1px}
.awards .r{font-size:12.5px;color:var(--ink4);white-space:nowrap;font-variant-numeric:tabular-nums}
.prize-high{color:var(--accent);font-weight:650}

.skills{display:grid;grid-template-columns:88px 1fr;gap:11px 20px;font-size:14px}
.skills dt{color:var(--ink4);font-size:13px}
.skills dd{color:var(--ink2)}
.skills .k{display:inline-block;margin:0 6px 6px 0;padding:2px 9px;border-radius:5px;background:#f4f2ee;font-size:13px}

.detail-hero{width:100%;max-height:440px;object-fit:cover;display:block;border-radius:12px;margin:30px 0 34px}
.crumb{font-size:13px;color:var(--ink4);padding:26px 0 0}
.crumb a:hover{color:var(--accent)}
.d-title{font-size:34px;font-weight:700;line-height:1.25;margin-top:10px}
.d-sub{font-size:15px;color:var(--accent);font-weight:500;margin-top:8px}
.d-meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:18px;font-size:14px;color:var(--ink3);
padding-bottom:26px;border-bottom:1px solid var(--rule)}
.d-lead{font-size:16px;color:var(--ink2);margin:26px 0 0}

.hl-list{display:grid;gap:22px;margin-top:6px}
.hl{border-left:2px solid var(--accent-soft);padding-left:18px}
.hl h4{font-size:15.5px;font-weight:600;line-height:1.55}
.hl p{font-size:14px;color:var(--ink2);margin-top:7px}
.hl .tags{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.hl .tags .chip{margin:0}

.metrics{width:100%;border-collapse:collapse;font-size:14px}
.metrics td{padding:9px 0;border-bottom:1px solid var(--rule);color:var(--ink2)}
.metrics td:first-child{color:var(--ink4);width:180px}
.metrics td:last-child{font-variant-numeric:tabular-nums;font-weight:500}

.gallery{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
.gallery img{width:100%;border-radius:10px;display:block;background:#eceae5}

.archive{font-size:14px;color:var(--ink2)}
.archive .row{display:flex;gap:14px;padding:8px 0;border-bottom:1px solid var(--rule)}
.archive .row:last-child{border-bottom:0}
.archive .k{color:var(--ink4);width:92px;flex-shrink:0}
.archive code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:#f4f2ee;padding:1px 6px;border-radius:4px}
.private-note{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink4);background:#f4f2ee;padding:3px 10px;border-radius:6px}

footer{padding:52px 0 64px;border-top:1px solid var(--rule);color:var(--ink4);font-size:13.5px}
footer a{color:var(--accent)}
footer .links{display:flex;gap:20px;margin-bottom:12px}

/* 私有库专用 */
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.toc{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.toc a{background:var(--card);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-size:14px;transition:background .15s}
.toc a:hover{background:var(--accent-soft)}
.toc .t{font-weight:500}
.toc .m{font-size:12.5px;color:var(--ink4)}
.retro{display:grid;gap:18px}
.retro-box{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:20px 22px}
.retro-box h4{font-size:14px;font-weight:650;margin-bottom:10px;color:var(--accent)}
.retro-box ul{list-style:none;display:grid;gap:8px}
.retro-box li{font-size:14px;color:var(--ink2);padding-left:16px;position:relative}
.retro-box li::before{content:"·";position:absolute;left:4px;color:var(--accent);font-weight:700}
.retro-box li b{color:var(--ink)}

@media (max-width:760px){
  .hero{padding:48px 0 36px}.hero h1{font-size:30px}
  .card{grid-template-columns:1fr;height:auto}.card-img{aspect-ratio:16/10;height:auto}.card-body{padding:18px}
  .gallery{grid-template-columns:1fr}.d-title{font-size:26px}
  .skills{grid-template-columns:1fr}.awards li{flex-direction:column;gap:2px}
  .metrics td:first-child{width:110px}
}
</style>
</head>
